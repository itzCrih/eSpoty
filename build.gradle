plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def mcVer = project.findProperty("minecraft_version") ?: "1.21.11"
def is26 = mcVer.startsWith("26.")
def is121 = mcVer.startsWith("1.21") && !mcVer.equals("1.21.11")
def is120 = mcVer == "1.20" || (mcVer.startsWith("1.20.") && !mcVer.equals("1.20.5") && !mcVer.equals("1.20.6"))
def is120Modern = mcVer.equals("1.20.5") || mcVer.equals("1.20.6")
def is1194 = mcVer.startsWith("1.19")

def family = project.findProperty("mc_family") ?: (
	is1194 ? "mc1194" : (
		(is120 || is120Modern) ? "mc120" : (
			is121 ? "mc121" : "modern"
		)
	)
)

sourceSets {
	main {
		java {
			srcDirs = ['src/main/java', "src-compat/${family}", 'src-stub']
		}
	}
}

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
}

base {
	archivesName = project.findProperty("archives_name") ?: "espoty"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	if (family == "modern") {
		modCompileOnly "maven.modrinth:modmenu:17.0.1"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	def mcDep = project.findProperty("mc_dep") ?: (
		is1194 ? "1.19.4" : (
			is120 ? mcVer : (
				is120Modern ? mcVer : (
					is121 ? mcVer : (
						is26 ? mcVer : "1.21.11"
					)
				)
			)
		)
	)
	inputs.property "mc_dep", mcDep

	def isJava17 = is1194 || is120
	def javaDep = project.findProperty("java_dep") ?: (is26 ? ">=25" : (isJava17 ? ">=17" : ">=21"))
	inputs.property "java_dep", javaDep

	def loaderDep = project.findProperty("loader_dep") ?: (is26 || mcVer == "1.21.11" ? ">=0.16.0" : ">=0.15.0")
	inputs.property "loader_dep", loaderDep

	filesMatching("fabric.mod.json") {
		expand "version": version, "mc_dep": mcDep, "java_dep": javaDep, "loader_dep": loaderDep
	}
}

def isJava17 = is1194 || is120
def javaRelease = is26 ? 25 : (isJava17 ? 17 : 21)
def jv = is26 ? JavaVersion.VERSION_25 : (isJava17 ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21)

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	if (project.hasProperty("with_sources")) {
		withSourcesJar()
	}
	sourceCompatibility = jv
	targetCompatibility = jv
}

jar {
	exclude 'com/terraformersmc/**'
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
